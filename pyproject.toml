[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photon-commerce"
dynamic = ["version"]
description = "Python SDK for Photon Commerce — process documents via the Photon API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Photon Commerce" }]
keywords = ["photon", "photoncommerce", "documents", "ocr", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.8",
    "respx>=0.21",
    "pytest-cov>=5",
]

[project.urls]
Homepage = "https://photoncommerce.com"
Documentation = "https://apidocs.photoncommerce.com"
Source = "https://github.com/Photon-Commerce/photon-sdk-python"
Issues = "https://github.com/Photon-Commerce/photon-sdk-python/issues"
Changelog = "https://github.com/Photon-Commerce/photon-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/photon/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/photon"]

# An explicit list: hatch only honours .gitignore, so without it a local build would
# also pick up git-excluded working files.
[tool.hatch.build.targets.sdist]
include = [
    "/src/photon",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Run with: pytest --cov
[tool.coverage.run]
source = ["photon"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
