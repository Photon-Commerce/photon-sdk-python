[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photon-sdk"
version = "0.0.1"
description = "Python SDK for Photon Commerce — process documents via the Photon API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Photon Commerce" }]
keywords = ["photon", "photoncommerce", "documents", "ocr", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://photoncommerce.com"
Source = "https://github.com/Photon-Commerce/photon-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/photon"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
